name: Build STM32

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build
        working-directory: CANbus_code
        run: make -j$(nproc)

      - name: Check binary size
        working-directory: CANbus_code
        run: |
          arm-none-eabi-size build/CANbus_code.elf
          echo "---"
          BIN_SIZE=$(stat -c%s build/CANbus_code.bin)
          echo "Flash binary: ${BIN_SIZE} bytes ($(( BIN_SIZE / 1024 )) KB / 128 KB)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            CANbus_code/build/CANbus_code.bin
            CANbus_code/build/CANbus_code.hex
            CANbus_code/build/CANbus_code.elf
