name: Build STM32

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build
        working-directory: CANbus_code
        run: make -j$(nproc)

      - name: Check binary size
        working-directory: CANbus_code
        run: |
          arm-none-eabi-size build/CANbus_code.elf
          echo "---"
          BIN_SIZE=$(stat -c%s build/CANbus_code.bin)
          echo "Flash binary: ${BIN_SIZE} bytes ($(( BIN_SIZE / 1024 )) KB / 128 KB)"
          echo "BIN_SIZE=${BIN_SIZE}" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: ncipollo/release-action@v1
        with:
          name: "Build ${{ github.run_number }}"
          tag: "nightly"
          commit: ${{ github.sha }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            CANbus_code/build/CANbus_code.bin
            CANbus_code/build/CANbus_code.hex
            CANbus_code/build/CANbus_code.elf
          body: |
            | 项目 | 值 |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Flash | `${{ env.BIN_SIZE }}` bytes |
            | 时间 | `${{ github.event.head_commit.timestamp }}` |
            | 消息 | ${{ github.event.head_commit.message }} |
